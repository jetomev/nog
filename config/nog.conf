# nog configuration file
# /etc/nog/nog.conf

[general]
version = "1.5.7"
log_level = "info"

[paths]
tier_pins   = "/etc/nog/tier-pins.toml"
pacman_conf = "/etc/pacman.conf"
log_file    = "/var/log/nog.log"
# v1.0.8: per-run CSV update logs ("YYYYMMDD nog-update.csv", 90-day
# retention). nog runs unprivileged, so this lives in user space; a leading
# ~/ expands against $HOME. Key is optional — this is also the default.
run_logs    = "~/.local/share/nog/logs"
# v1.6.0 (#27): when each pending update was first seen, so a new build does
# not restart its hold. User space too. Key is optional — this is the default.
hold_record = "~/.local/state/nog/holds.tsv"

[repos]
staging = "https://repo.kognog.org/staging"
testing = "https://repo.kognog.org/testing"
stable  = "https://repo.kognog.org/stable"

[holds]
tier1_days = 30
tier2_days = 15
tier3_days = 7
# v1.6.0 (#27): the safety wait. A hold's window is counted from the FIRST new
# version seen, so a new build no longer restarts it. When the window is over,
# the newest version is released once it is itself at least this many days old.
tier1_safety_days = 7
tier2_safety_days = 3
tier3_safety_days = 1

[aur]
# AUR helper to use for AUR-only packages and AUR update detection.
#   "auto" — prefer yay, fall back to paru, skip AUR support if neither installed
#   "yay"  — require yay; error if not installed
#   "paru" — require paru; error if not installed
#   "none" — disable all AUR-aware paths (official repos only)
helper = "auto"

[clean]
# v1.5.5: how many versions of each package `nog clean` keeps in pacman's
# download cache, per tier. The installed version always counts as one, and
# is never removed. Optional section; these are the defaults.
tier1_keep = 3
tier2_keep = 2
tier3_keep = 1
